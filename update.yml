name: Update model data

on:
  schedule:
    - cron: "0 21 * * *"      # 06:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_data.js"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build data
        run: node scripts/build_data.js
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update model data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
