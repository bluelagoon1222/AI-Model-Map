name: Update model data

on:
  schedule:
    - cron: "0 21 * * *"      # 06:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_data.js"
      - "curation.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build data
        run: node build_data.js

      # 빈 결과로 사이트 데이터를 덮어쓰지 않도록 확인
      - name: Verify data
        run: |
          node -e "const d=require('./models.json'); const n=(d.models||[]).length; console.log('models', n, 'generated', d.generated_at); if(!n){console.error('models.json 이 비었습니다 - 커밋 중단'); process.exit(1);}"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models.json updates.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update model data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
